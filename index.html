<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <title>.raadioo</title>
        <meta
        name="description"
        content="RAADIOO provides a simple radio player for online 
        experimental community radios." />
        <link rel="icon" href="./favicon.png" type="image/x-icon" />
        <link rel="stylesheet" href="./styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1><a href="./index.html">.raadioo</a></h1>

        
        <div class="container">
            <audio id="radio-player" controls></audio>
        </div>

        <div class="container">
            <select name="radios" id="radio-select">
                <option value="">--tune a raadioo--</option>
                <optgroup label="Belgium">
                    <option value="https://kioskradiobxl.out.airtime.pro/kioskradiobxl_b">Kiosk Radio</option>
                </optgroup>
                <optgroup label="Brazil">
                    <option value="https://veneno.out.airtime.pro/veneno_b">Veneno</option>
                </optgroup>
                <optgroup label="Canada">
                    <option value="https://n10as.radiocult.fm/stream">N10.as</option>
                </optgroup>
                <optgroup label="France">
                    <option value="https://flouka.out.airtime.pro/flouka_a">Radio Flouka</option>
                    <option value="https://icecast.lyl.live/live">LYL</option>
                    <option value="https://ola-radio.radiocult.fm/stream">Ola</option>
                </optgroup>
                <optgroup label="Georgia">
                    <option value="https://listen.radioking.com/radio/282820/stream/328621">Mutant Radio</option>
                </optgroup>
                <optgroup label="Germany">
                    <option value="https://streaming.radio.co/s3699c5e49/listen">Refuge Worldwide</option>
                    <option value="https://cashmereradio.out.airtime.pro/cashmereradio_b">Cashmere Radio</option>
                    <option value="https://yarakaradio.out.airtime.pro/yarakaradio_a">Yaraka Radio</option>
                    <option value="https://radio80k.out.airtime.pro:8000/radio80k_a">Radio 8000</option>
                </optgroup>
                <optgroup label="Greece">
                    <option value="https://movementathens.out.airtime.pro/movementathens_a">Stegi Radio</option>
                </optgroup>
                <optgroup label="Italy">
                    <option value="https://pantano.ovh:8444/pantano">Fango Radio</option>
                    <option value="https://radioraheem.out.airtime.pro/radioraheem_a">Radio Raheem</option>
                    <option value="https://roughradio1.out.airtime.pro/roughradio1_a">Rough Radio</option>
                </optgroup>
                <optgroup label="Lithuania">
                    <option value="https://transliacija.audiomastering.lt/radiovilnius-mp3">Radio Vilnius</option>
                </optgroup>
                <optgroup label="Mexico">
                    <option value="https://c11.radioboss.fm:18270/stream">Internet Public Radio</option>
                </optgroup>
                <optgroup label="Netherlands">
                    <option value="https://origin.streamnerd.nl/operator/operator/icecast.audio">Operator Radio</option>
                </optgroup>
                <optgroup label="Palestine">
                    <option value="http://n02.radiojar.com/78cxy6wkxtzuv?1634328730=&rj-tok=AAABfIWfHK4AlWz8Q03vJJQdWw&rj-ttl=5">Radio Alhara</option>
                </optgroup>
                <optgroup label="Russia">
                    <option value="https://radio.syg.ma/audio">syg.ma</option>
                </optgroup>
                <optgroup label="Spanish State">
                    <option value="https://streamer.radio.co/sd6131729c/listen">Radio Relativa</option>
                </optgroup>
                <optgroup label="Sweden">
                    <option value="http://retreatradio.out.airtime.pro:8000/retreatradio_b">Retreat Radio</option>
                </optgroup>
                <optgroup label="Switzerland">

                    <option value="http://stream-relay-geo.ntslive.net/stream2">NTS2</option>

                    <option value="https://worldwide-fm.radiocult.fm/stream">Worldwide FM</option>
                </optgroup>
                <optgroup label="USA">
                    <option value="http://dublab.out.airtime.pro:8000/dublab_a">dublab</option>
                </optgroup>
                </select>
        </div>
        <div class="container-bottom">
            <p>¶ Simple radio player for experimental community radios.</p>
            <p>¶ <a href="https://raadioo.org/about.html">About</a>.</p>

        </div>
    </body>
    <script>
        const radioPlayer = document.getElementById("radio-player");
        const radioSelect = document.getElementById("radio-select");

        radioSelect.addEventListener("change", function() {
            if (this.value) {
                radioPlayer.src = this.value;
                radioPlayer.play();
            } else {
                radioPlayer.pause();
                radioPlayer.src = "";
            }
        });
    </script>
    </html>
